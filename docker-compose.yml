name: monitor

# 所有變數都有開發用預設值，不建 .env 也能直接 docker compose up；正式環境務必覆寫密碼
x-db-env: &db-env
  DB_HOST: db
  DB_PORT: 3306
  DB_USER: ${DB_USER:-monitor}
  DB_PASSWORD: ${DB_PASSWORD:-monitorpass}
  DB_NAME: ${DB_NAME:-monitor}

services:
  db:
    image: mariadb:11.7
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${DB_NAME:-monitor}
      MARIADB_USER: ${DB_USER:-monitor}
      MARIADB_PASSWORD: ${DB_PASSWORD:-monitorpass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend

  api:
    build: ./backend
    environment:
      <<: *db-env
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me-in-production-0123456789}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin12345}
      SEED_USER_USERNAME: ${SEED_USER_USERNAME:-user}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-user12345}
      SEED_VIEWER_USERNAME: ${SEED_VIEWER_USERNAME:-viewer}
      SEED_VIEWER_PASSWORD: ${SEED_VIEWER_PASSWORD:-viewer12345}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # slim 映像沒有 curl，用 Python 標準庫打 /health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend

  # --- 測試專用（docker compose --profile test run --rm api-test）---
  db-test:
    image: mariadb:11.7
    profiles: [test]
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: monitor_test
      MARIADB_USER: monitor
      MARIADB_PASSWORD: monitorpass
    # 資料放記憶體，測試結束即消失
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks:
      - backend

  api-test:
    build:
      context: ./backend
      target: test
    profiles: [test]
    environment:
      DB_HOST: db-test
      DB_PORT: 3306
      DB_USER: monitor
      DB_PASSWORD: monitorpass
      DB_NAME: monitor_test
      DB_USE_NULL_POOL: "true"
      ENABLE_GENERATOR: "false"
    depends_on:
      db-test:
        condition: service_healthy
    networks:
      - backend

volumes:
  db_data:

networks:
  backend:
