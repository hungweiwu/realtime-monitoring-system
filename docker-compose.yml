name: monitor

# 所有變數都有開發用預設值，不建 .env 也能直接 docker compose up；正式環境務必覆寫密碼
x-db-env: &db-env
  DB_HOST: db
  DB_PORT: 3306
  DB_USER: ${DB_USER:-monitor}
  DB_PASSWORD: ${DB_PASSWORD:-monitorpass}
  DB_NAME: ${DB_NAME:-monitor}

services:
  db:
    image: mariadb:11.7
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${DB_NAME:-monitor}
      MARIADB_USER: ${DB_USER:-monitor}
      MARIADB_PASSWORD: ${DB_PASSWORD:-monitorpass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend

  api:
    build: ./backend
    environment:
      <<: *db-env
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me-in-production-0123456789}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      IMPORT_MAX_BYTES: ${IMPORT_MAX_BYTES:-5242880}
      IMPORT_MAX_ROWS: ${IMPORT_MAX_ROWS:-10000}
      IMPORT_DEFAULT_TIMEZONE: ${IMPORT_DEFAULT_TIMEZONE:-Asia/Taipei}
      ENABLE_GENERATOR: ${ENABLE_GENERATOR:-true}
      METRIC_INTERVAL_SECONDS: ${METRIC_INTERVAL_SECONDS:-1}
      METRIC_ANOMALY_LOW: ${METRIC_ANOMALY_LOW:-10}
      METRIC_ANOMALY_HIGH: ${METRIC_ANOMALY_HIGH:-90}
      FLUSH_INTERVAL_SECONDS: ${FLUSH_INTERVAL_SECONDS:-5}
      FLUSH_BATCH_SIZE: ${FLUSH_BATCH_SIZE:-50}
      BUFFER_MAX_SIZE: ${BUFFER_MAX_SIZE:-10000}
      WS_SEND_TIMEOUT_SECONDS: ${WS_SEND_TIMEOUT_SECONDS:-1}
      ANALYTICS_TIMEZONE: ${ANALYTICS_TIMEZONE:-Asia/Taipei}
      EXPORT_MAX_ROWS: ${EXPORT_MAX_ROWS:-50000}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin12345}
      SEED_USER_USERNAME: ${SEED_USER_USERNAME:-user}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-user12345}
      SEED_VIEWER_USERNAME: ${SEED_VIEWER_USERNAME:-viewer}
      SEED_VIEWER_PASSWORD: ${SEED_VIEWER_PASSWORD:-viewer12345}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # slim 映像沒有 curl，用 Python 標準庫打 /health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend

  frontend:
    build: ./frontend
    environment:
      # Streamlit 的 Python 端在容器內呼叫後端，用服務名
      API_BASE_URL: http://api:8000
      # 即時頁的 JS 在使用者瀏覽器執行，要用瀏覽器連得到的位址
      PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "${FRONTEND_HOST_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend

  # --- 測試專用（docker compose --profile test run --rm api-test）---
  db-test:
    image: mariadb:11.7
    profiles: [test]
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: monitor_test
      MARIADB_USER: monitor
      MARIADB_PASSWORD: monitorpass
    # 資料放記憶體，測試結束即消失
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks:
      - backend

  api-test:
    build:
      context: ./backend
      target: test
    profiles: [test]
    environment:
      DB_HOST: db-test
      DB_PORT: 3306
      DB_USER: monitor
      DB_PASSWORD: monitorpass
      DB_NAME: monitor_test
      DB_USE_NULL_POOL: "true"
      ENABLE_GENERATOR: "false"
    depends_on:
      db-test:
        condition: service_healthy
    networks:
      - backend

volumes:
  db_data:

networks:
  backend:
